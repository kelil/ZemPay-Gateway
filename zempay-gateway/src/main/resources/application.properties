spring.application.name=zempay-gateway

server.port=8081

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/zempay_test}
spring.datasource.username=${DB_USERNAME:zempay}
spring.datasource.password=${DB_PASSWORD:zempay_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

#logging.level.org.springframework.security=TRACE