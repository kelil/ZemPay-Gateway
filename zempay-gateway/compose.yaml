services:
  postgres:
    image: postgres:14
    container_name: zempay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zempay
      POSTGRES_USER: zempay
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zempay_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - zempay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zempay -d zempay"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zempay_postgres_data: